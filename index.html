<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FeniBlox — Онлайн Песочница</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #ffffff;
            text-align: center;
            padding: 50px 20px;
            margin: 0;
        }
        h1 {
            color: #ff6600;
            font-size: 3.5rem;
            margin-bottom: 10px;
            text-shadow: 0 0 10px rgba(255, 102, 0, 0.5);
        }
        .subtitle {
            color: #aaaaaa;
            font-size: 1.2rem;
            margin-bottom: 30px;
        }
        .card {
            background-color: #1e1e1e;
            padding: 40px;
            border-radius: 15px;
            display: inline-block;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid #333;
            max-width: 500px;
        }
        .online-box {
            background-color: #252525;
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
            border-left: 5px solid #00ff66;
            font-size: 1.1rem;
        }
        #online-count {
            font-weight: bold;
            color: #00ff66;
        }
        .btn {
            background-color: #ff6600;
            color: white;
            padding: 12px 30px;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1.1rem;
            display: inline-block;
            transition: 0.2s;
            margin-top: 10px;
        }
        .btn:hover {
            background-color: #e65500;
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <h1>FeniBlox 1.0</h1>
    <div class="subtitle">Микс Roblox + KoGaMa от Phoenix123-rus</div>

    <div class="card">
        <h2>Проект в разработке</h2>
        <p>Добро пожаловать! FeniBlox — это новая независимая онлайн-песочница на движке Defold (Lua).</p>
        
        <!-- Наш будущий блок онлайна -->
        <div class="online-box">
            Сейчас в игре: <span id="online-count">Загрузка...</span> игроков
        </div>

        <a href="#" class="btn">Скачать Версию 1.0 (Скоро)</a>
    </div>

    <script>
        // Этот скрипт в будущем будет брать реальный онлайн с твоего Serv00 сервера
        // Пока сервера нет, мы временно поставим симуляцию, чтобы сайт выглядел живым
        function updateFakeOnline() {
            document.getElementById('online-count').innerText = "0"; // Пока 0, так как мы только строим
        }
        window.onload = updateFakeOnline;
    </script>

</body>
</html>
