<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FeniBlox — Главная</title>
    <style>
        /* Подключаем базовые настройки стиля по твоему рисунку */
        body {
            background-color: #1a1b1e; /* Темно-серый фон */
            color: #0ed145; /* Твой фирменный неоново-салатовый цвет */
            font-family: 'Segoe Script', 'Comic Sans MS', cursive, sans-serif;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        /* ТЕСТОВАЯ КНОПКА — для проверки режимов */
        .test-switcher {
            position: fixed;
            bottom: 20px; left: 20px;
            background: #2a2b30; padding: 10px;
            border: 2px solid #0ed145; border-radius: 5px;
            z-index: 9999; color: #fff; font-family: sans-serif; font-size: 12px;
        }
        .test-switcher button {
            background: #0ed145; border: none; padding: 5px 10px; cursor: pointer; font-weight: bold;
            font-family: 'Segoe Script', cursive; color: #1a1b1e; border-radius: 3px; margin-left: 5px;
        }

        /* ШАПКА САЙТА (ХЕДЕР) */
        header {
            background-color: #111215;
            border-bottom: 2px solid #2d2e33;
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 60px;
            padding: 0 20px;
        }
        .nav-links {
            display: flex;
            height: 100%;
            align-items: center;
        }
        .logo {
            font-size: 1.6rem;
            font-weight: bold;
            margin-right: 30px;
        }
        .nav-item {
            padding: 0 20px;
            height: 100%;
            display: flex;
            align-items: center;
            border-right: 1px solid #2d2e33;
            cursor: pointer;
            text-decoration: none;
            color: #0ed145;
            font-size: 1.2rem;
        }
        .nav-item:hover {
            background-color: #222429;
        }

        /* ПАНЕЛЬ ПРОФИЛЯ / ВХОДА */
        .auth-panel {
            display: flex;
            align-items: center;
            gap: 12px;
            height: 100%;
        }
        /* Стили для кнопок Войти / Рег */
        .btn-auth {
            background: transparent;
            border: 2px solid #0ed145;
            color: #0ed145;
            font-family: 'Segoe Script', cursive;
            padding: 5px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1rem;
            transition: 0.2s;
        }
        .btn-auth:hover {
            background: #0ed145;
            color: #1a1b1e;
        }
        /* Стиль аватарки и уровня из твоего рисунка */
        .user-profile-box {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.9rem;
            text-align: right;
        }
        .user-avatar-img {
            width: 44px;
            height: 44px;
            border: 2px solid #0ed145;
            border-radius: 5px;
            background: #111215;
        }

        /* ОСНОВНОЙ КОНТЕНТ */
        .main-layout {
            display: flex;
            min-height: calc(100vh - 62px);
        }
        
        /* ИГРОВАЯ ЗОНА (ЛЕВАЯ ЧАСТЬ) */
        .games-section {
            flex: 1;
            padding: 20px;
            box-sizing: border-box;
        }
        
        /* ПОИСКОВАЯ СТРОКА */
        .search-container {
            margin-bottom: 25px;
        }
        .search-bar {
            width: 100%;
            max-width: 700px;
            background-color: #222429;
            border: 2px solid #3a3c43;
            padding: 10px;
            color: #0ed145;
            font-family: 'Segoe Script', cursive;
            font-size: 0.9rem;
            outline: none;
            box-sizing: border-box;
        }

        /* КАТЕГОРИИ ИГР */
        .category-title {
            font-size: 1.3rem;
            margin: 20px 0 10px 0;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .games-row {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 30px;
        }
        /* Зеленые квадраты из твоего рисунка */
        .game-slot {
            width: 110px;
            height: 110px;
            border: 2px solid #0ed145;
            border-radius: 12px;
            cursor: pointer;
            transition: 0.2s;
            background-color: transparent;
        }
        .game-slot:hover {
            transform: scale(1.05);
            background-color: rgba(14, 209, 69, 0.1);
            box-shadow: 0 0 10px rgba(14, 209, 69, 0.3);
        }

        /* БОКОВАЯ ПАНЕЛЬ ДРУЗЕЙ (ПРАВАЯ ЧАСТЬ) */
        aside {
            width: 250px;
            border-left: 2px solid #2d2e33;
            background-color: #141518;
            padding: 20px;
            box-sizing: border-box;
        }
        .aside-title {
            font-size: 1.1rem;
            border-bottom: 1px solid #2d2e33;
            padding-bottom: 10px;
            margin-top: 0;
            text-align: center;
        }
        .friends-placeholder {
            margin-top: 40px;
            font-size: 1.4rem;
            text-align: center;
            line-height: 1.6;
        }

        /* Анимация скрытия элементов */
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <!-- ТЕСТОВЫЙ ПЕРЕКЛЮЧАТЕЛЬ ДЛЯ ТЕБЯ -->
    <div class="test-switcher">
        Режим: 
        <button onclick="setMode('guest')">Гость</button> 
        <button onclick="setMode('user')">Вошёл</button>
    </div>

    <!-- ШАПКА -->
    <header>
        <div class="nav-links">
            <div class="logo">FeniBlox</div>
            <a class="nav-item">🎮 Игры</a>
            <a class="nav-item" id="nav-friends-link">👥 Друзья</a>
            <a class="nav-item">💬 Форум</a>
        </div>
        
        <!-- Блок авторизации (Кнопки или Ава с ником) -->
        <div class="auth-panel" id="auth-zone">
            <!-- Сюда скрипт вставляет контент в зависимости от режима -->
        </div>
    </header>

    <!-- ОСНОВНАЯ СЕТКА -->
    <main class="main-layout">
        
        <!-- ЛЕВАЯ ЧАСТЬ: ИГРЫ -->
        <section class="games-section">
            <div class="search-container">
                <input type="text" class="search-bar" placeholder="Нажмите сюда чтобы начать поиск игр..." readonly>
            </div>

            <!-- РЕКОМЕНДАЦИИ -->
            <div class="category-title">⭐ Рекомендации</div>
            <div class="games-row" id="row-recommendations">
                <!-- Квадраты генерируются автоматически -->
            </div>

            <!-- ПРОДОЛЖИТЬ ИГРАТЬ -->
            <div id="block-continue">
                <div class="category-title">🎮 Продолжить играть</div>
                <div class="games-row">
                    <div class="game-slot"></div><div class="game-slot"></div><div class="game-slot"></div>
                    <div class="game-slot"></div><div class="game-slot"></div><div class="game-slot"></div>
                </div>
            </div>

            <!-- ИЗБРАННЫЕ ИГРЫ -->
            <div id="block-favorites">
                <div class="category-title">❤️ Избранные игры</div>
                <div class="games-row">
                    <div class="game-slot"></div><div class="game-slot"></div><div class="game-slot"></div>
                    <div class="game-slot"></div><div class="game-slot"></div><div class="game-slot"></div>
                </div>
            </div>
        </section>

        <!-- ПРАВАЯ ЧАСТЬ: ДРУЗЬЯ -->
        <aside id="sidebar-friends">
            <p class="aside-title">Список друзей</p>
            <div class="friends-placeholder">
                ✳️ ТУТ СПИСОК ДРУЗЕЙ ✳️
            </div>
        </aside>

    </main>

    <script>
        function setMode(mode) {
            const authZone = document.getElementById('auth-zone');
            const navFriends = document.getElementById('nav-friends-link');
            const blockContinue = document.getElementById('block-continue');
            const blockFavorites = document.getElementById('block-favorites');
            const sidebarFriends = document.getElementById('sidebar-friends');
            const recRow = document.getElementById('row-recommendations');

            if (mode === 'guest') {
                // РЕЖИМ ГОСТЯ:
                authZone.innerHTML = `
                    <button class="btn-auth">Войти</button>
                    <button class="btn-auth">Регистрация</button>
                `;
                navFriends.classList.add('hidden');
                sidebarFriends.classList.add('hidden');
                blockContinue.classList.add('hidden');
                blockFavorites.classList.add('hidden');
                
                // Для гостя расширяем рекомендации до 12 слотов
                generateSlots(recRow, 12);
            } else {
                // РЕЖИМ АВТОРИЗОВАННОГО ПОЛЬЗОВАТЕЛЯ (Твой профиль):
                authZone.innerHTML = `
                    <div class="user-profile-box">
                        <div style="color: #666; font-size: 0.8rem;">[Создатель]</div>
                        <div style="color: #fff;">✳️ FeniBlox ✳️</div>
                        <div style="color: #0ed145;">✳️ 100 LVL ✳️</div>
                    </div>
                    <img class="user-avatar-img" src="https://icons8.com" alt="Ава">
                `;
                navFriends.classList.remove('hidden');
                sidebarFriends.classList.remove('hidden');
                blockContinue.classList.remove('hidden');
                blockFavorites.classList.remove('hidden');
        // Обычные рекомендации (6 квадратов по рисунку)
        generateSlots(recRow, 6);
    }
}

// Функция для генерации пустых зеленых квадратов игр
function generateSlots(container, count) {
    container.innerHTML = '';
    for(let i = 0; i < count; i++) {
        const slot = document.createElement('div');
        slot.className = 'game-slot';
        container.appendChild(slot);
    }
}

// Запуск сайта по умолчанию в режиме создателя
window.onload = function() {
    setMode('user');
}
