<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FeniBlox</title>
    <style>
        body { background: #1a1b1e; color: #0ed145; font-family: 'Segoe Script', cursive, sans-serif; margin: 0; user-select: none; }
        header { background: #111215; border-bottom: 2px solid #2d2e33; display: flex; justify-content: space-between; align-items: center; height: 60px; padding: 0 20px; }
        .nav { display: flex; align-items: center; gap: 20px; }
        .logo { font-size: 1.6rem; font-weight: bold; }
        .nav-item { cursor: pointer; font-size: 1.2rem; }
        .auth { display: flex; align-items: center; gap: 12px; }
        .btn { background: transparent; border: 2px solid #0ed145; color: #0ed145; font-family: 'Segoe Script'; padding: 5px 15px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .btn:hover { background: #0ed145; color: #1a1b1e; }
        .avatar { width: 44px; height: 44px; border: 2px solid #0ed145; border-radius: 5px; }
        .main { display: flex; min-height: calc(100vh - 62px); }
        .content { flex: 1; padding: 20px; }
        .search { width: 100%; max-width: 700px; background: #222429; border: 2px solid #3a3c43; padding: 10px; color: #0ed145; font-family: 'Segoe Script'; margin-bottom: 25px; }
        .title { font-size: 1.3rem; margin: 20px 0 10px 0; }
        .row { display: flex; gap: 15px; flex-wrap: wrap; margin-bottom: 30px; }
        .slot { width: 110px; height: 110px; border: 2px solid #0ed145; border-radius: 12px; cursor: pointer; display: flex; flex-direction: column; justify-content: center; align-items: center; font-size: 0.65rem; text-align: center; }
        .slot:hover { transform: scale(1.05); background: rgba(14, 209, 69, 0.1); }
        aside { width: 250px; border-left: 2px solid #2d2e33; background: #141518; padding: 20px; text-align: center; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); justify-content: center; align-items: center; z-index: 2000; }
        .win { background: #111215; border: 2px solid #0ed145; border-radius: 15px; width: 350px; padding: 30px; text-align: center; position: relative; }
        .close { position: absolute; top: 10px; right: 15px; font-size: 1.5rem; cursor: pointer; }
        .btn-google { background: #fff; color: #000; border: none; padding: 10px; width: 100%; font-family: sans-serif; font-weight: bold; border-radius: 5px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 15px; }
        .btn-google:hover { background: #e6e6e6; }
    </style>
</head>
<body>

    <header>
        <div class="nav">
            <div class="logo">FeniBlox</div>
            <div class="nav-item">🎮 Игры</div>
            <div class="nav-item">👥 Друзья</div>
            <div class="nav-item">💬 Форум</div>
        </div>
        <div class="auth" id="auth-zone">
            <!-- Кнопки входа изменятся после логина -->
            <button class="btn" onclick="openModal(true,'🔑 Вход через Google')">Войти</button>
            <button class="btn" onclick="openModal(true,'🔐 Регистрация')">Регистрация</button>
        </div>
    </header>

    <main class="main">
        <section class="content">
            <input type="text" class="search" placeholder="Нажмите сюда чтобы начать поиск игр..." readonly>
            
            <div class="title">⭐ Рекомендации</div>
            <div class="row" id="row-rec"></div>

            <div class="title">🎮 Продолжить играть</div>
            <div class="row" id="row-cont"></div>

            <div class="title">❤️ Избранные игры</div>
            <div class="row" id="row-fav"></div>
        </section>

        <aside>
            <p>Список друзей</p>
            <div style="margin-top:40px; font-size:1.4rem;">✳️ ТУТ СПИСОК ДРУЗЕЙ ✳️</div>
        </aside>
    </main>

    <div class="modal" id="myModal" onclick="if(event.target==this)openModal(false)">
        <div class="win">
            <span class="close" onclick="openModal(false)">&times;</span>
            <h3 id="m-title">Вход</h3>
            <p style="font-size:0.85rem; color:#8b949e;">Быстрый доступ к платформе FeniBlox</p>
            
            <!-- Кнопка авторизации через Google -->
            <button class="btn-google" onclick="loginWithGoogle()">
                <img src="https://icons8.com" alt="G"> 
                Войти через Google
            </button>
        </div>
    </div>

    <script>
        const games = [
            { title: "Битва Арена 3D", icon: "⚔️" }, { title: "Лаки Блок Гонки", icon: "❓" },
            { title: "Отель DOORS", icon: "🚪" }, { title: "Рейд на Феникса", icon: "🔥" }
        ];

        function openModal(show, title = '🔐 Вход') {
            document.getElementById('m-title').innerText = title;
            document.getElementById('myModal').style.display = show ? 'flex' : 'none';
        }

        // Функция симуляции Google API
        function loginWithGoogle() {
            openModal(false);
            alert("FeniBlox API: Подключение к серверам Google...");
            
            // После успешного ответа Google API переключаем шапку на твой админский профиль
            const auth = document.getElementById('auth-zone');
            auth.innerHTML = `
                <div style="text-align:right; font-size:0.9rem;">
                    <div style="color:#fff;">✳️ FeniBlox ✳️</div>
                    <div style="color:#0ed145;">✳️ 100 LVL ✳️</div>
                </div>
                <img class="avatar" src="https://icons8.com">
            `;
            alert("Добро пожаловать, FeniBlox! Вы успешно вошли через Google.");
        }

        function buildGames(id) {
            const box = document.getElementById(id);
            if (!box) return; box.innerHTML = '';
            games.forEach(g => {
                const el = document.createElement('div'); el.className = 'slot';
                el.innerHTML = `<div style="font-size:1.8rem">${g.icon}</div><div style="padding:0 5px">${g.title}</div>`;
                el.onclick = () => alert('Запуск игры: ' + g.title);
                box.appendChild(el);
            });
        }

        window.onload = () => {
            buildGames('row-rec'); 
            buildGames('row-cont'); 
            buildGames('row-fav');
        }
    </script>
</body>
</html>
